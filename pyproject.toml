[project]
name = "z4j-django"
version = "1.9.1"
description = "z4j Django framework adapter (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "django", "celery", "task"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Intra-z4j floor policy: every z4j package in a release wave
    # is tested together, so intra-z4j floors track the wave version
    # and refuse mixed installs (R9-H2 precedent).
    "z4j-core>=1.9.1,<2",
    "z4j-bare>=1.9.1,<2",
    # Security-supported Django lanes. Django 6 requires Python >=3.12,
    # so 5.2.17 is the fixed floor on Python 3.11 and 6.0.8 is the
    # fixed floor on Python 3.12+. The latter stays uncapped: standalone
    # adapter installs can resolve Django 6.1, while integrations with
    # django-celery-beat 2.9 resolve 6.0.8 because upstream currently
    # constrains that coexistence graph to Django <6.1.
    # Keeping the markers in published metadata means every supported
    # interpreter resolves a branch that includes the August 2026 fixes
    # instead of leaving operator installs open to Django 6.0.7.
    #
    # API floor: every Django symbol z4j-django imports (AppConfig,
    # settings, system-checks framework, BaseCommand, apps registry,
    # BigAutoField string) is covered by both lanes. The Python 3.11
    # branch stays below Django 6 because that line requires Python 3.12.
    #
    # SQLParse is a transitive Django dependency, but its security floor
    # is direct here so no resolver can select the vulnerable <0.6 line.
    "django>=5.2.17,<6; python_version < '3.12'",
    "django>=6.0.8; python_version >= '3.12'",
    "sqlparse>=0.6.0",
]

[project.optional-dependencies]
# Canonical engine bundles. `pip install z4j-django[celery]` pulls
# the engine adapter AND its companion scheduler in one shot, so a
# fresh install never needs a second command.
celery   = ["z4j-celery>=1.9.1,<2",   "z4j-celerybeat>=1.9.1,<2"]
# R9 H-2: z4j-rq floor lifted to >=1.6.7 here so the [rq] extra
# never resolves a pre-1.6.7 z4j-rq alongside this 1.6.8+ adapter
# stack. See packages/z4j/pyproject.toml for the full rationale.
rq       = ["z4j-rq>=1.9.1,<2",       "z4j-rqscheduler>=1.9.1,<2"]
dramatiq = ["z4j-dramatiq>=1.9.1,<2", "z4j-apscheduler>=1.9.1,<2"]
huey     = ["z4j-huey>=1.9.1,<2",     "z4j-hueyperiodic>=1.9.1,<2"]
arq      = ["z4j-arq>=1.9.1,<2",      "z4j-arqcron>=1.9.1,<2"]
taskiq   = ["z4j-taskiq>=1.9.1,<2",   "z4j-taskiqscheduler>=1.9.1,<2"]
# Every engine in one shot - useful for CI matrices that exercise
# all adapters against a Django host.
all = [
    "z4j-celery>=1.9.1,<2",   "z4j-celerybeat>=1.9.1,<2",
    "z4j-rq>=1.9.1,<2",       "z4j-rqscheduler>=1.9.1,<2",  # R9 H-2 floor
    "z4j-dramatiq>=1.9.1,<2", "z4j-apscheduler>=1.9.1,<2",
    "z4j-huey>=1.9.1,<2",     "z4j-hueyperiodic>=1.9.1,<2",
    "z4j-arq>=1.9.1,<2",      "z4j-arqcron>=1.9.1,<2",
    "z4j-taskiq>=1.9.1,<2",   "z4j-taskiqscheduler>=1.9.1,<2",
]

[project.scripts]
# 1.1.2+ console script. ``z4j-django <subcommand>`` works without
# loading Django settings (env-var only). For Django-flavored config
# loading use ``manage.py z4j_doctor`` etc. - both surfaces are
# supported and dispatch to the same shared diagnostics.
z4j-django = "z4j_django.cli:main"

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-django/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-django/issues"
Source = "https://github.com/z4jdev/z4j-django"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_django"]
